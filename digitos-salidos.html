  const c=Array(10).fill(0);
  rows.forEach(r=>[r.mid3,r.eve3,r.mid4,r.eve4].forEach(v=>{if(v&&/^\d+$/.test(v))v.split('').forEach(d=>c[+d]++)}));
  const ord=c.map((n,d)=>({d,n})),hot=ord.slice().sort((a,b)=>b.n-a.n||a.d-b.d).slice(0,3),cold=ord.slice().sort((a,b)=>a.n-b.n||a.d-b.d).slice(0,3);
