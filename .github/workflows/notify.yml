name: Notifikasyon rezilta

on:
  schedule:
    - cron: "*/10 * * * *"   # gade nouvo rezilta chak 10 minit (GitHub ka retade yon ti jan)
  workflow_dispatch:
    inputs:
      force:
        description: "Voye yon notifikasyon tès kounye a (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: notify-results
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gade nouvo rezilta epi voye notifikasyon
        env:
          ONESIGNAL_APP_ID: a5f12c17-b24a-44ec-b230-873f38ddeff2
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: node scripts/notify.js
      - name: Sove eta a (pou pa voye menm rezilta de fwa)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/state.json
          git diff --staged --quiet || (git commit -m "chore: update notify state" && git push)
