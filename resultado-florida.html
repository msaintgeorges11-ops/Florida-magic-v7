 and evening draws. Always verify with the official source.", "h1": "Florida Results Midday / Evening", "h2": "🎯 Pick 3 + Pick 4 – latest results", "c1": "DATE", "c2": "MIDDAY", "c3": "EVENING", "load": "Loading...", "none": "Check the official source.", "verify": "Always verify with the official source.", "btn": "Official results", "more": "Also read:", "l1": "How to read the results", "l2": "Today's lottery", "l3": "Responsible play", "disc": "FLORIDA MAGIC is not affiliated with the Florida Lottery or any lottery. The numbers shown are random, for entertainment only: they do not predict results, do not improve your odds and do not guarantee any prize. Play responsibly. Ages 18 and over only."}};
function etNow(){const o={};new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date()).forEach(p=>o[p.type]=+p.value);if(o.hour===24)o.hour=0;return o}
var LOC={es:'es-DO',fr:'fr-FR',en:'en-US'};
function fmt(y,m,d,l,short){return new Date(Date.UTC(y,m-1,d,12)).toLocaleDateString(LOC[l],{day:'2-digit',month:short?'short':'long',year:'numeric',timeZone:'UTC'}).toUpperCase()}
var cur='es';try{var v=localStorage.getItem('lang');if(v&&LOC[v])cur=v}catch(e){}
function baseSet(l){
  cur=l;document.documentElement.lang=l;
  document.title=T[l].title;document.getElementById('md').setAttribute('content',T[l].desc);
  document.querySelectorAll('[data-l]').forEach(function(e){e.hidden=e.getAttribute('data-l')!==l});
  document.querySelectorAll('[data-b]').forEach(function(b){b.className=b.getAttribute('data-b')===l?'on':''});
  document.querySelectorAll('[data-t]').forEach(function(e){var k=e.getAttribute('data-t');if(T[l][k]!=null)e.textContent=T[l][k]});
  try{localStorage.setItem('lang',l)}catch(e){}
}
document.querySelectorAll('[data-b]').forEach(function(b){b.addEventListener('click',function(){setL(b.getAttribute('data-b'))})});
const o=etNow(),tn=o.year*10000+o.month*100+o.day;
var rows=null;
function render(){
  const tb=document.getElementById('res');
  if(rows===null)return;
  tb.innerHTML='';
  if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=3;td.textContent=T[cur].none;tr.appendChild(td);tb.appendChild(tr);return}
  rows.forEach(function(r){
    const p=String(r.date).split('-').map(Number);
    const mid=((r.mid3||'')+' '+(r.mid4||'')).trim()||'---',eve=((r.eve3||'')+' '+(r.eve4||'')).trim()||'---';
    const tr=document.createElement('tr');
    [fmt(p[0],p[1],p[2],cur,true),mid,eve].forEach(function(x){const td=document.createElement('td');td.textContent=x;tr.appendChild(td)});
    tb.appendChild(tr);
  });
}
function clean(list){
  return list.filter(function(r){const q=String(r.date||'').split('-').map(Number);return q.length===3&&q[0]*10000+q[1]*100+q[2]<=tn})
    .sort(function(a,b){return String(b.date).localeCompare(String(a.date))}).slice(0,10);
}
async function load(){
  let list=null;
  try{
    const r=await fetch('/api/results?'+Date.now(),{cache:'no-store'});
    const d=await r.json();
    if(d&&Array.isArray(d.rows)&&d.rows.length)list=d.rows;
  }catch(e){}
  if(!list){
    try{
      const r=await fetch('/results.json?'+Date.now(),{cache:'no-store'});
      const d=r.ok?await r.json():null;
      if(Array.isArray(d)&&d.length)list=d;
    }catch(e){}
  }
  rows=list?clean(list):[];
  render();
}
function setL(l){baseSet(l);document.querySelectorAll('.fd').forEach(function(x){x.textContent=fmt(o.year,o.month,o.day,l)});render();window.scrollTo(0,0)}
setL(cur);
load();
